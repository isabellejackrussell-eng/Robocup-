[platformio]
default_envs = sensor_test

[env]
platform = teensy
board = teensy40
framework = arduino
monitor_speed = 115200
lib_deps =
    Servo
    arkhipenko/TaskScheduler
    adafruit/Adafruit BNO055
    adafruit/Adafruit Unified Sensor
    adafruit/Adafruit BusIO
    adafruit/Adafruit TCS34725
    https://github.com/bitcraze/Bitcraze_PMW3901.git
    https://github.com/DFRobot/DFRobot_MatrixLidar.git
    https://github.com/sparkfun/SparkFun_SX1509_Arduino_Library.git
    pololu/VL53L1X@^1.3.1
    pololu/VL53L0X@^1.3.1
    https://github.com/cesarvandevelde/HerkulexServo.git
    https://github.com/rlogiacco/CircularBuffer.git

[env:sensor_test]
extends = env
build_flags = -DROBOT_MODE=3

[env:motion_test]
extends = env
build_flags = -DROBOT_MODE=1

[env:claw_test]
extends = env
build_flags = -DROBOT_MODE=2

[env:sensor_claw_test]
extends = env
build_flags = -DROBOT_MODE=4

[env:nav_motion_test]
extends = env
build_flags = -DROBOT_MODE=5

[env:full_integration_test]
extends = env
build_flags = -DROBOT_MODE=6

[env:competition]
extends = env
build_flags = -DROBOT_MODE=7
